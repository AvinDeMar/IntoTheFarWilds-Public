name: Deploy public artwork gallery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-art-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install the image verifier
        run: python -m pip install -r requirements.txt
      - name: Verify public allowlist and derivatives
        run: python -B scripts/publish_art.py verify
      - name: Build static gallery
        run: python -B scripts/publish_art.py build-site --output "$RUNNER_TEMP/public-art-gallery"
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload public gallery
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/public-art-gallery
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
